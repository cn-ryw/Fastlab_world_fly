name: 功能建议
description: 提议可验证的新功能或改进
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: motivation
    attributes:
      label: 使用场景
      description: 说明当前限制和目标用户。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述期望行为、验收方法及兼容性影响。
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: 性能与安全影响
      description: 若涉及感知、规划或控制，请说明潜在风险。
