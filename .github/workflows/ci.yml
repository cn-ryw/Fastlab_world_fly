name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python test dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Prepare isolated web fixtures
        run: |
          mkdir -p third_party/Cesium/Widgets asset/vendor
          touch third_party/Cesium/Cesium.js
          touch third_party/Cesium/Widgets/widgets.css
          curl --fail --location --retry 3 \
            https://cdn.jsdelivr.net/npm/playcanvas@2.17.2/build/playcanvas.min.js \
            --output asset/vendor/playcanvas.min.js
          python scripts/verify_dependencies.py \
            --skip-cesium --skip-source --skip-checkpoints
      - name: Audit public tree
        run: python scripts/audit_public_tree.py
      - name: Run JavaScript tests
        run: for test_file in tests/*.js; do node "$test_file"; done
      - name: Run non-GPU Python tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m pytest -q
